<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171d24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Золотой выстрел · Shatterbird</title>
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <main id="arena">
    <canvas id="scene" aria-label="Трёхмерная башня и две пушки"></canvas>
    <div id="reticle" aria-hidden="true"><i></i></div>
    <header>
      <div class="brand">
        <a href="../">Shatterbird</a>
        <h1>Золотой выстрел</h1>
      </div>
      <nav aria-label="Комната и экран">
        <button id="invite">Пригласить</button>
        <button id="full" class="icon" aria-label="Полный экран" title="Полный экран"><span class="corners"></span></button>
      </nav>
    </header>
    <aside id="share" hidden aria-label="Ссылка приглашения">
      <p id="share-note">Отправь эту ссылку второму игроку</p>
      <input id="url" type="url" readonly aria-label="Ссылка приглашения">
      <button id="leave">Выйти из комнаты</button>
    </aside>

    <section class="outcome" id="outcome" hidden aria-live="polite">
      <p id="outcome-caption"></p>
      <strong id="outcome-title"></strong>
      <button id="again">Ещё раунд</button>
    </section>

    <footer>
      <div class="team blue"><span>Синие</span><strong id="score-a">0</strong></div>
      <div class="actions">
        <div id="status" role="status">Загружаем арену…</div>
        <div class="fire-row">
          <button class="fire" id="fire" disabled><span>Огонь</span><kbd>Пробел</kbd></button>
          <button id="restart" class="icon restart" aria-label="Заново" title="Заново" disabled>↻</button>
        </div>
        <p id="tip">Наведи прицел и попади ядром в золотой куб</p>
      </div>
      <div class="team red"><span>Красные</span><strong id="score-b">0</strong></div>
    </footer>
  </main>
  <script src="relay-config.js?v=1"></script>
  <script type="module" src="game.js?v=1"></script>
</body>
</html>
