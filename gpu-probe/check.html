<!doctype html><html><head><meta charset="utf-8"><title>WebGPU check</title></head><body><pre id="o">checking…</pre>
<script>
(async () => {
  const o = document.getElementById('o');
  const r = { secure: isSecureContext, ua: navigator.userAgent, gpu: !!navigator.gpu };
  try {
    if (navigator.gpu) {
      const a = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
      r.adapter = !!a;
      if (a) {
        r.info = a.info ? { vendor: a.info.vendor, architecture: a.info.architecture, device: a.info.device, description: a.info.description } : null;
        r.features = [...a.features];
        r.limits = { maxStorageBufferBindingSize: a.limits.maxStorageBufferBindingSize, maxComputeWorkgroupSizeX: a.limits.maxComputeWorkgroupSizeX, maxComputeInvocationsPerWorkgroup: a.limits.maxComputeInvocationsPerWorkgroup, maxComputeWorkgroupStorageSize: a.limits.maxComputeWorkgroupStorageSize, maxBufferSize: a.limits.maxBufferSize, maxStorageBuffersPerShaderStage: a.limits.maxStorageBuffersPerShaderStage };
      }
    }
  } catch (e) { r.error = String(e); }
  window.__check = r;
  o.textContent = JSON.stringify(r, null, 2);
})();
</script></body></html>
